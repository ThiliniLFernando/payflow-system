    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

apis:
  account-service: http://localhost:8084/accounts

app:
  kafka:
    topics:
      internal-transaction-created: new.internal.transaction.created
      internal-transaction-created-alt: new.internl.trnsction.cretead
